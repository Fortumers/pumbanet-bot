name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify nonempty core files
        run: test -s app/domain.py && test -s tests/test_domain.py && test -s README.md
      - name: Compile
        run: python -m compileall -q app tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
